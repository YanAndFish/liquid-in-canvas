name: Release

# `pnpm release`（bumpp）推送 `v*` 标签后发布库到 npm，并生成 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # npm provenance 与 trusted publishing 需要 OIDC 令牌。
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./packages/liquid-in-canvas/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match liquid-in-canvas@$version"
            exit 1
          fi

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build library
        run: pnpm build:lib

      # 用 pnpm 打包：只有它会把 publishConfig.exports（指向 dist）换进包里的 package.json。
      # pnpm pack 不运行 prepublishOnly，所以上一步先构建。
      - name: Pack
        working-directory: packages/liquid-in-canvas
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          pnpm pack --pack-destination "$RUNNER_TEMP/package"

      # 用 npm CLI 发布打好的包：npm 11.5.1 起支持 trusted publishing（OIDC，免令牌），
      # 在 npm 上为这个工作流配置了 trusted publisher 时直接使用；否则使用仓库密钥 NPM_TOKEN。
      # 带预发布号的版本（如 1.0.0-beta.1）发布到 next 标签。
      - name: Publish to npm
        run: |
          npm install -g npm@^11.5.1
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          npm publish "$RUNNER_TEMP"/package/*.tgz --access public --provenance --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
