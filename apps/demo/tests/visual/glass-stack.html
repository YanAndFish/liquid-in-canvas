<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多层玻璃叠放检查</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; font-family: system-ui, sans-serif; }
    canvas, #app { width: 100vw; height: 100vh; }
    #app {
      position: relative;
      overflow: clip;
      background:
        linear-gradient(90deg, rgb(0 0 0 / 35%) 1px, transparent 1px) 0 0 / 32px 32px,
        linear-gradient(rgb(0 0 0 / 35%) 1px, transparent 1px) 0 0 / 32px 32px,
        linear-gradient(160deg, #8ec5ff, #f6c38b 55%, #e86a5a);
    }
    .glass { position: absolute; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #111; }
    .panel { left: 60px; top: 60px; width: 520px; height: 320px; flex-direction: column; gap: 12px; }
    .bar { left: 120px; top: 300px; width: 420px; height: 64px; }
    .chip { left: 420px; top: 270px; width: 120px; height: 120px; }
    .capsule { left: 660px; top: 80px; width: 360px; height: 56px; justify-content: flex-start; padding-left: 12px; }
    .capsule .active { position: relative; width: 110px; height: 40px; }
    .pair-a { left: 660px; top: 220px; width: 180px; height: 120px; }
    .pair-b { left: 760px; top: 260px; width: 180px; height: 120px; }
    #controls { position: fixed; bottom: 20px; left: 20px; display: flex; flex-wrap: wrap; gap: 12px; padding: 16px; background: white; border-radius: 12px; }
    button { padding: 8px 12px; }
  </style>
</head>
<body>
<canvas id="stage" content="drawable"><div id="app" drawable>
  <div class="glass panel" data-liquid-glass data-glass-radius="32" data-glass-layer="0"><strong>第 0 层面板</strong><span>上层应透出这里的文字与磨砂</span></div>
  <div class="glass bar" data-liquid-glass data-glass-variant="clear" data-glass-radius="32" data-glass-layer="1">第 1 层工具条</div>
  <div class="glass chip" data-liquid-glass data-glass-variant="clear" data-glass-radius="60" data-glass-layer="2">第 2 层</div>
  <div class="glass capsule" data-liquid-glass data-glass-radius="28">
    <div class="glass active" data-liquid-glass data-glass-variant="clear" data-glass-radius="20"></div>
    <span style="margin-left: 24px">嵌套激活项应透出外层磨砂</span>
  </div>
  <div class="glass pair-a" data-liquid-glass data-glass-fusion="0" data-glass-radius="24">同层 A</div>
  <div class="glass pair-b" data-liquid-glass data-glass-fusion="0" data-glass-radius="24" data-glass-variant="clear">同层 B（不融合）</div>
</div></canvas>
<div id="controls">
  <button id="move">移动工具条</button>
  <button id="layer">工具条改到第 0 层</button>
  <button id="add">添加玻璃</button>
  <button id="remove">移除玻璃</button>
  <button id="hide">隐藏圆形</button>
  <span id="status">等待绘制</span>
</div>
<script type="module">
  import { CanvasStage } from 'liquid-in-canvas/canvas'
  import { applyGlassQuery, applyStageQuery } from '../query'
  applyGlassQuery(new URLSearchParams(location.search))
  const canvas = document.querySelector('#stage')
  const root = document.querySelector('#app')
  const bar = document.querySelector('.bar')
  const status = document.querySelector('#status')
  const stage = new CanvasStage({ canvas, onFault: error => { status.textContent = String(error) } })
  applyStageQuery(stage, new URLSearchParams(location.search))
  await stage.init()
  stage.start(root)
  status.textContent = '上层玻璃应折射并模糊下层玻璃'
  let moved = false
  document.querySelector('#move').onclick = () => {
    moved = !moved
    bar.style.top = moved ? '480px' : '300px'
  }
  let flat = false
  document.querySelector('#layer').onclick = event => {
    flat = !flat
    bar.dataset.glassLayer = flat ? '0' : '1'
    event.target.textContent = flat ? '工具条改到第 1 层' : '工具条改到第 0 层'
  }
  // 生效与移除：新玻璃材质化出现，移除或隐藏的玻璃在原处退去。
  let added = null
  document.querySelector('#add').onclick = () => {
    if (added)
      return
    added = document.createElement('div')
    added.className = 'glass'
    added.dataset.liquidGlass = ''
    added.dataset.glassRadius = '40'
    added.dataset.glassLayer = '3'
    added.style.cssText = 'left: 760px; top: 480px; width: 220px; height: 80px;'
    added.textContent = '新玻璃'
    root.append(added)
  }
  document.querySelector('#remove').onclick = () => {
    added?.remove()
    added = null
  }
  let hiddenChip = false
  document.querySelector('#hide').onclick = event => {
    hiddenChip = !hiddenChip
    document.querySelector('.chip').style.display = hiddenChip ? 'none' : ''
    event.target.textContent = hiddenChip ? '显示圆形' : '隐藏圆形'
  }
  window.addEventListener('pagehide', () => stage.dispose(), { once: true })
</script>
</body>
</html>
