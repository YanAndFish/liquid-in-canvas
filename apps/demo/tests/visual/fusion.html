<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>融合检查</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; font-family: system-ui, sans-serif; background: #19191d; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #app { position: relative; width: 100vw; height: 100vh; overflow: clip; background: #19191d; color: white; }
    .stripes { position: absolute; left: 0; top: 0; width: 720px; height: 100%; background: repeating-linear-gradient(-45deg, #ff5f6d 0 32px, #ffc36a 32px 64px, #4ecdc4 64px 96px, #7c5cff 96px 128px); }
    .square { position: absolute; left: 100px; top: 60px; width: 200px; height: 200px; display: grid; place-items: center; }
    .square span { font-size: 96px; font-weight: 500; background: linear-gradient(135deg, #38c172, #4f8cff 45%, #ff5f6d 75%, #ffc36a); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .label { position: absolute; left: 470px; top: 330px; font-size: 64px; font-weight: 600; color: #c13ab0; }
  </style>
</head>
<body>
<div id="app">
  <div class="stripes"></div>
  <div class="square" data-liquid-glass><span>玖</span></div>
  <div class="label" id="label"></div>
</div>
<script type="module">
  import { mountLiquidGlass } from 'liquid-in-canvas'
  import { createGlassTuner } from 'liquid-in-canvas/tuner'

  const query = new URLSearchParams(location.search)
  const optics = query.get('optics') ?? 'hybrid'
  const labels = { profile: '剖面', hybrid: '混合', raymarch: '求交' }
  document.getElementById('label').textContent = labels[optics] ?? optics
  const mount = await mountLiquidGlass({
    root: document.getElementById('app'),
    mode: 'canvas',
    optics,
    fieldCache: query.get('cache') !== '0',
    onFault: console.error,
  })
  const position = query.has('x') ? { x: Number(query.get('x')), y: Number(query.get('y')) } : undefined
  window.tuner = createGlassTuner({ mount, position })
  window.mount = mount
</script>
</body>
</html>
